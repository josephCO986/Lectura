name: lectura_flutter_app
description: "App de lectura temporal con arquitectura limpia."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^14.2.7
  
  # HTTP Client
  http: ^1.2.2
  dio: ^5.7.0
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # Dependency Injection
  get_it: ^8.0.0
  injectable: ^2.4.4
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # Either for functional programming
  dartz: ^0.10.1
  
  # UI Components
  flutter_svg: ^2.0.10+1
  
  # Barcode/QR Scanner
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  
  # Audio feedback
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
